name: Build and publish Android test APK

# Manually triggered only. Do not label an old checkout as a new game build.
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: 'Full commit SHA containing the test version (must be pushed to GitHub)'
        required: true
        type: string

concurrency:
  group: android-test-release-${{ inputs.expected_source_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-debug-apk:
    name: Build and verify debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v5

        with:
          persist-credentials: false

      - name: Require the intended source commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked out $actual, but expected $EXPECTED_SHA. Push the intended version and select its branch before running."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platforms;android-36 build-tools;35.0.0

      - name: Install dependencies
        run: npm ci

      - name: Create static web bundle and sync Capacitor
        run: npm run build:android

      - name: Assemble debug APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Verify Android manifest and debug signature
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid package version"; exit 1; }
          tag="v${version}-test"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p release
          apk="release/hormuz-${version}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          "$tools/aapt" dump badging "$apk" > /tmp/hormuz-badging
          grep -F "versionName='$version'" /tmp/hormuz-badging
          "$tools/apksigner" verify --print-certs "$apk" > /tmp/hormuz-signature
          grep -F 'CN=Android Debug' /tmp/hormuz-signature
          cp "strait-of-hormuz-game-docs/release-notes/$tag.md" release/notes.md
          sha="$(sha256sum "$apk" | cut -d' ' -f1)"
          printf '\n**Commit:** `%s`\n\n**SHA-256:** `%s`\n' "$GITHUB_SHA" "$sha" >> release/notes.md
          printf 'tag=%s\napk=%s\nsha=%s\n' "$tag" "${apk##*/}" "$sha" >> "$GITHUB_OUTPUT"
          echo "Verified APK SHA-256: $sha"

      - name: Save APK as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.package.outputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 14

    outputs:
      tag: ${{ steps.package.outputs.tag }}
      apk: ${{ steps.package.outputs.apk }}
      sha: ${{ steps.package.outputs.sha }}

  publish:
    needs: publish-debug-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: android-release-${{ needs.publish-debug-apk.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-${{ needs.publish-debug-apk.outputs.tag }}
          path: release
      - name: Upload to draft, verify GitHub checksum, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publish-debug-apk.outputs.tag }}
          APK: ${{ needs.publish-debug-apk.outputs.apk }}
          SHA: ${{ needs.publish-debug-apk.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::Android release failed at line $LINENO. Inspect the draft and the Actions artifact."' ERR
          printf '%s  %s\n' "$SHA" "release/$APK" | sha256sum -c -
          id="$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")"
          if [[ -z "$id" ]]; then
            gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" --title "آزمایشی اندروید $TAG" --notes-file release/notes.md
            id="$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")"
          fi
          [[ "$id" =~ ^[0-9]+$ ]]
          release="repos/$GH_REPO/releases/$id"
          [[ "$(gh api "$release" --jq .draft)" == true ]] || { echo "::error::Release $TAG is already published"; exit 1; }
          if existing="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha 2>/dev/null)"; then
            [[ "$existing" == "$GITHUB_SHA" ]] || { echo "::error::Existing tag points at $existing instead of $GITHUB_SHA"; exit 1; }
          fi
          upload="$(gh api "$release" --jq .upload_url)"
          asset="$(gh api "$release/assets" --jq ".[] | select(.name == \"$APK\") | .id")"
          if [[ -n "$asset" ]]; then gh api -X DELETE "repos/$GH_REPO/releases/assets/$asset"; fi
          [[ "$upload" == "https://uploads.github.com/repos/$GH_REPO/releases/"* ]]
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Content-Type: application/vnd.android.package-archive' \
            --data-binary "@release/$APK" "${upload%%\{*}?name=$APK" > /tmp/apk-asset.json
          asset="$(jq -er '.id' /tmp/apk-asset.json)"
          gh api "repos/$GH_REPO/releases/assets/$asset" |
            jq -e --arg apk "$APK" --arg sha "sha256:$SHA" '.state == "uploaded" and .name == $apk and .digest == $sha'
          if [[ -z "$existing" ]]; then
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --jq .ref
          fi
          [[ "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" == "$GITHUB_SHA" ]]
          gh api -X PATCH "$release" -f target_commitish="$GITHUB_SHA" -F draft=false -F prerelease=true -f body="$(cat release/notes.md)" --jq .html_url
          [[ "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" == "$GITHUB_SHA" ]]
          gh api "repos/$GH_REPO/releases/assets/$asset" --jq .browser_download_url
