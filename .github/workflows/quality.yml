name: Game quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build:android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: bash android/gradlew -p android assembleDebug lintDebug --no-daemon
