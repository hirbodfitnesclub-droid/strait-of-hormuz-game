name: Game quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      native_apk_run:
        description: Optional existing Game quality run to retest the same APK on Android
        type: string
        required: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: ${{ !inputs.native_apk_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build:android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platforms;android-36 build-tools;35.0.0
      - run: bash android/gradlew -p android assembleDebug lintDebug --no-daemon

      - name: Retain the APK built from the selected working branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: hormuz-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-opening:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (needs.verify.result == 'success' || (inputs.native_apk_run && needs.verify.result == 'skipped')) }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Select the signed candidate and verify its source
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_RUN: ${{ inputs.native_apk_run || github.run_id }}
        run: |
          set -euo pipefail
          [[ "$SELECTED_RUN" =~ ^[0-9]+$ ]]
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SELECTED_RUN")
          jq -e '.path == ".github/workflows/quality.yml" and .event == "workflow_dispatch"' <<< "$metadata" > /dev/null
          source_sha=$(jq -er '.head_sha' <<< "$metadata")
          git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA"
          git diff --exit-code "$source_sha" "$GITHUB_SHA" -- . ':!.github/workflows/quality.yml' ':!scripts/test-opening-android.mjs' ':!strait-of-hormuz-game-docs/'
          gh run download "$SELECTED_RUN" --name "hormuz-debug-$source_sha" --dir candidate
          sha256sum candidate/app-debug.apk
      - name: Enable hardware acceleration on the ephemeral runner
        run: sudo chmod a+rw /dev/kvm
      - name: Exercise the signed harbor build in Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 4096M
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: node scripts/test-harbor-android.mjs candidate/app-debug.apk "$RUNNER_TEMP/hormuz-android"
      - name: Retain Android run traces, screenshots and device logs
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v5
        with:
          name: android-harbor-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/hormuz-android/
          if-no-files-found: warn
          retention-days: 14

  mobile-regressions:
    if: github.event_name == 'workflow_dispatch' && !inputs.native_apk_run
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: hormuz-debug-${{ github.sha }}
          path: candidate
      - name: Exercise existing mobile flows against the assembled APK contents
        env:
          AUDIT_CHROMIUM: /usr/bin/google-chrome
          TEST_URL: http://127.0.0.1:3310
        run: |
          unzip -q candidate/app-debug.apk 'assets/public/*'
          mv assets/public out
          python3 -m http.server 3310 --bind 127.0.0.1 --directory out > "$RUNNER_TEMP/game-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npm run test:mobile
